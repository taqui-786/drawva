<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawva widget host</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    iframe { width: 100%; height: 100%; display: block; border: 0; background: transparent !important; touch-action: none; }
  </style>
</head>
<body>
<script>
"use strict";
// Drawva widget host. Runs inside a sandboxed outer iframe and renders untrusted
// widget HTML inside a NO-SAME-ORIGIN inner iframe. Parent communicates via
// postMessage; the parent origin is validated before any reply is sent.
(() => {
  const MAX_HTML_LENGTH = 200000;
  const MAX_SNAPSHOT_DIMENSION = 2400;
  const MAX_SNAPSHOT_PIXELS = 4800000;
  const MAX_SNAPSHOT_DATA_URL = 28 * 1024 * 1024;

  const requestedParentOrigin = new URL(location.href).searchParams.get("parent-origin");
  let parentOrigin = null;
  try {
    const u = new URL(requestedParentOrigin);
    if (u.origin === requestedParentOrigin) parentOrigin = u.origin;
  } catch {}
  if (!parentOrigin) parentOrigin = location.origin; // same-origin fallback (dev)

  const inner = document.createElement("iframe");
  inner.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  inner.setAttribute("title", "canvas widget");
  inner.setAttribute("referrerpolicy", "no-referrer");
  document.body.append(inner);

  function writeInner(html) {
    const autoResizeScript = `<script>
      (function() {
        let lastW = 0;
        let lastH = 0;
        function postSize() {
          try {
            const body = document.body;
            if (!body) return;
            const first = body.firstElementChild;
            if (!first) return;

            const bodyRect = body.getBoundingClientRect();
            const firstRect = first.getBoundingClientRect();
            let targetW = 0;
            let targetH = 0;

            // 1. Check for SVG graphics (Mermaid / DOT / Vega / SMILES / Icons)
            const svg = document.querySelector('svg');
            if (svg) {
              try {
                let svgW = 0, svgH = 0;
                const g = svg.querySelector('g');
                if (g && g.getBBox) {
                  const gb = g.getBBox();
                  if (gb && gb.width > 20 && gb.height > 20) {
                    svgW = gb.width;
                    svgH = gb.height;
                  }
                }
                if (!svgW && svg.viewBox && svg.viewBox.baseVal) {
                  svgW = svg.viewBox.baseVal.width;
                  svgH = svg.viewBox.baseVal.height;
                }
                if (svgW > 20 && svgH > 20) {
                  targetW = Math.max(targetW, Math.ceil(svgW + 32));
                  targetH = Math.max(targetH, Math.ceil(svgH + 32));
                }
              } catch(e) {}
            }

            // 2. Measure HTML container intrinsic width
            const firstStyle = window.getComputedStyle(first);
            const hasMaxWidth = firstStyle.maxWidth && firstStyle.maxWidth !== 'none' && firstStyle.maxWidth !== '100%';
            const hasExplicitWidth = firstStyle.width && firstStyle.width !== '100%' && !firstStyle.width.endsWith('%');

            if (hasMaxWidth || hasExplicitWidth) {
              targetW = Math.max(targetW, Math.ceil(firstRect.width));
            } else {
              // Measure rightmost coordinate of content elements inside wrapper
              let maxRight = 0;
              const children = first.querySelectorAll('input, button, select, textarea, img, svg, canvas, table, h1, h2, h3, h4, h5, h6, p, span, a, label, form, section, article, .card, [class*="card"], [class*="container"], [class*="box"]');
              if (children.length > 0) {
                for (let i = 0; i < children.length; i++) {
                  const child = children[i];
                  const cr = child.getBoundingClientRect();
                  if (cr.width > 0 && cr.height > 0) {
                    const r = (cr.right - bodyRect.left);
                    // Ignore full-width block containers stretching to 100% iframe width unless fixed element
                    const isFullStretchedBlock = (cr.width >= bodyRect.width - 12) && (child.tagName === 'DIV' || child.tagName === 'FORM' || child.tagName === 'SECTION');
                    if (r > maxRight && !isFullStretchedBlock) {
                      maxRight = r;
                    }
                  }
                }
              }

              if (maxRight > 40) {
                targetW = Math.max(targetW, Math.ceil(maxRight + 16));
              } else {
                targetW = Math.max(targetW, Math.ceil(firstRect.width || 0));
              }
            }

            // Height measurement
            const contentH = Math.max(body.scrollHeight || 0, first.scrollHeight || 0, Math.ceil(firstRect.height || 0));
            targetH = Math.max(targetH, contentH);

            if (targetW < 100) targetW = 320;
            if (targetH < 80) targetH = 240;
            targetW = Math.min(1200, Math.max(220, targetW));
            targetH = Math.min(900, Math.max(140, targetH));

            if (Math.abs(targetW - lastW) > 6 || Math.abs(targetH - lastH) > 6) {
              lastW = targetW;
              lastH = targetH;
              window.parent.postMessage({ type: 'drawva-widget-resize-content', width: targetW, height: targetH }, '*');
            }
          } catch(e) {}
        }
        window.addEventListener('DOMContentLoaded', postSize);
        window.addEventListener('load', postSize);
        if (typeof ResizeObserver !== 'undefined' && document.body) {
          try {
            const target = document.body.firstElementChild || document.body;
            new ResizeObserver(postSize).observe(target);
          } catch(e) {}
        }
        window.addEventListener('wheel', function(e) {
          e.preventDefault();
          window.parent.postMessage({
            type: 'drawva-widget-inner-wheel',
            clientX: e.clientX,
            clientY: e.clientY,
            deltaX: e.deltaX,
            deltaY: e.deltaY
          }, '*');
        }, { passive: false });

        window.addEventListener('pointerdown', function(e) {
          window.parent.postMessage({
            type: 'drawva-widget-inner-pointerdown'
          }, '*');
        }, true);

        setTimeout(postSize, 60);
        setTimeout(postSize, 300);
      })();
    <\/script>`;

    const transparentBase = '<style>html,body{background:transparent!important;overflow:hidden!important;margin:0!important;padding:4px;box-sizing:border-box}::-webkit-scrollbar{display:none!important}</style>' + autoResizeScript;
    const source = /<\/head>/i.test(html)
      ? html.replace(/<\/head>/i, transparentBase + '</head>')
      : transparentBase + html;
    inner.srcdoc = source;
  }

  function forward(msg) {
    if (parentOrigin) parent.postMessage(msg, parentOrigin);
  }
  // Fallback for snapshots/wheel if origin not pinned. Never used for content.
  const postAnywhere = (msg) => parent.postMessage(msg, "*");

  addEventListener("message", (event) => {
    const data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "penecho-widget-init") {
      if (typeof data.html !== "string" || data.html.length > MAX_HTML_LENGTH) return;
      writeInner(data.html);
    } else if (data.type === "penecho-widget-state") {
      inner.contentWindow && inner.contentWindow.postMessage({ type: "penecho-widget-state", selected: !!data.selected, active: !!data.active }, "*");
    } else if (data.type === "drawva-widget-resize-content") {
      forward({ type: "drawva-widget-resize-content", width: data.width, height: data.height });
    } else if (data.type === "drawva-widget-inner-wheel") {
      postAnywhere({
        type: "drawva-widget-wheel",
        clientX: data.clientX,
        clientY: data.clientY,
        deltaX: data.deltaX,
        deltaY: data.deltaY
      });
    } else if (data.type === "drawva-widget-inner-pointerdown") {
      postAnywhere({ type: "drawva-widget-pointerdown" });
    }
  });

  // Forward wheel from inside the host so the parent canvas still pans/zooms.
  addEventListener("wheel", (ev) => {
    ev.preventDefault();
    postAnywhere({
      type: "drawva-widget-wheel",
      clientX: ev.clientX,
      clientY: ev.clientY,
      deltaX: ev.deltaX,
      deltaY: ev.deltaY
    });
  }, { passive: false });

  // Forward pointerdown from inside the host so parent WidgetManager selects this widget on click.
  addEventListener("pointerdown", () => {
    postAnywhere({ type: "drawva-widget-pointerdown" });
  }, true);

  forward({ type: "penecho-widget-host-ready" });
})();
</script>
</body>
</html>
