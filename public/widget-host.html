<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawva widget host</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    iframe { width: 100%; height: 100%; display: block; border: 0; background: transparent !important; touch-action: none; }
  </style>
</head>
<body>
<script>
"use strict";
// Drawva widget host. Runs inside a sandboxed outer iframe and renders untrusted
// widget HTML inside a NO-SAME-ORIGIN inner iframe. Parent communicates via
// postMessage; the parent origin is validated before any reply is sent.
(() => {
  const MAX_HTML_LENGTH = 200000;
  const MAX_SNAPSHOT_DIMENSION = 4000;
  const MAX_SNAPSHOT_PIXELS = 12000000;
  const MAX_SNAPSHOT_DATA_URL = 28 * 1024 * 1024;

  const requestedParentOrigin = new URL(location.href).searchParams.get("parent-origin");
  let parentOrigin = null;
  try {
    const u = new URL(requestedParentOrigin);
    if (u.origin === requestedParentOrigin) parentOrigin = u.origin;
  } catch {}
  if (!parentOrigin) parentOrigin = location.origin; // same-origin fallback (dev)

  const inner = document.createElement("iframe");
  inner.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  inner.setAttribute("title", "canvas widget");
  inner.setAttribute("referrerpolicy", "no-referrer");
  document.body.append(inner);

  function writeInner(html) {
    const autoResizeScript = `<script>
      (function() {
        let lastH = 0;
        let lastW = 0;

        function svgSize(svg) {
          if (!svg) return null;
          const vb = svg.viewBox && svg.viewBox.baseVal;
          if (vb && vb.width > 2 && vb.height > 2) return { w: vb.width, h: vb.height };
          const p = (svg.getAttribute('viewBox') || '').split(/[\\s,]+/).map(Number);
          if (p.length === 4 && p[2] > 2 && p[3] > 2) return { w: p[2], h: p[3] };
          const wAttr = parseFloat(svg.getAttribute('width') || '');
          const hAttr = parseFloat(svg.getAttribute('height') || '');
          if (wAttr > 2 && hAttr > 2 && !String(svg.getAttribute('width') || '').includes('%')) {
            return { w: wAttr, h: hAttr };
          }
          try {
            const r = svg.getBoundingClientRect();
            if (r.width > 2 && r.height > 2) return { w: r.width, h: r.height };
          } catch(e) {}
          return null;
        }

        let measureTimer = 0;
        function emitSize(width, height) {
          const w = Math.min(3200, Math.max(80, Math.ceil(width)));
          const h = Math.min(6000, Math.max(60, Math.ceil(height)));
          if (Math.abs(h - lastH) > 2 || Math.abs(w - lastW) > 2) {
            lastW = w;
            lastH = h;
            window.parent.postMessage({ type: 'drawva-widget-resize-content', width: w, height: h }, '*');
          }
        }

        function scheduleSize() {
          clearTimeout(measureTimer);
          measureTimer = setTimeout(postSize, 48);
        }

        function contentBox() {
          const body = document.body;
          const root = document.documentElement;
          const skip = { SCRIPT:1, STYLE:1, LINK:1, META:1, TITLE:1, NOSCRIPT:1 };
          let right = 0;
          let bottom = 0;
          const nodes = body.querySelectorAll('*');
          for (let i = 0; i < nodes.length; i++) {
            const el = nodes[i];
            if (el === body || el === root || skip[el.tagName]) continue;
            let r;
            try { r = el.getBoundingClientRect(); } catch (e) { continue; }
            if (r.width <= 1 || r.height <= 1) continue;
            right = Math.max(right, r.right);
            bottom = Math.max(bottom, r.bottom);
            if (el.tagName === 'SVG') {
              const nat = svgSize(el);
              if (nat) {
                right = Math.max(right, r.left + nat.w);
                bottom = Math.max(bottom, r.top + nat.h);
              }
            }
            if (el.tagName === 'CANVAS') {
              const cw = Number(el.width) || r.width;
              const ch = Number(el.height) || r.height;
              right = Math.max(right, r.left + cw);
              bottom = Math.max(bottom, r.top + ch);
            }
          }
          return { w: right, h: bottom };
        }

        function postSize() {
          try {
            const body = document.body;
            const root = document.documentElement;
            if (!body) return;
            const stage = document.getElementById('stage');
            if (stage && /^rendering\b/i.test((stage.textContent || '').trim()) && !stage.querySelector('svg, canvas, .vega-embed')) return;

            // Single standalone SVG (mermaid/dot/etc): use its intrinsic size.
            // NEVER take the first of several SVGs — analog clocks, dashboards,
            // and multi-card applets would collapse to one face and clip the rest.
            const svgs = document.querySelectorAll('#stage svg, .vega-embed svg, svg');
            const text = String(body.innerText || '').replace(/\s+/g, ' ').trim();
            const extraVisual = body.querySelector('canvas, img, video');
            if (svgs.length === 1 && !extraVisual && text.length < 8) {
              const nat = svgSize(svgs[0]);
              if (nat) {
                emitSize(nat.w + 16, nat.h + 16);
                return;
              }
            }

            // Probe at a generous layout width so width:100% / flex rows lay out
            // fully instead of reporting the current (often too-small) iframe.
            const hs = root.style, bs = body.style;
            const prev = {
              hw: hs.width, hh: hs.height, hmin: hs.minWidth, ho: hs.overflow,
              bw: bs.width, bh: bs.height, bmin: bs.minWidth, bo: bs.overflow
            };
            hs.width = '1600px';
            hs.height = 'max-content';
            hs.minWidth = 'max-content';
            hs.overflow = 'visible';
            bs.width = 'max-content';
            bs.height = 'max-content';
            bs.minWidth = 'max-content';
            bs.overflow = 'visible';
            const box = contentBox();
            hs.width = prev.hw; hs.height = prev.hh; hs.minWidth = prev.hmin; hs.overflow = prev.ho;
            bs.width = prev.bw; bs.height = prev.bh; bs.minWidth = prev.bmin; bs.overflow = prev.bo;

            const pad = 16;
            if (box.w < 8 || box.h < 8) return;
            emitSize(box.w + pad, box.h + pad);
          } catch(e) {}
        }

        // ── Snapshot: serialize first SVG to a canvas data URL, post it back ──
        function postSnapshot(reqId) {
          try {
            const svg = document.querySelector('svg');
            if (!svg) {
              const canvasEl = document.querySelector('canvas');
              if (canvasEl && canvasEl.width > 2 && canvasEl.height > 2) {
                try {
                  const dataUrl = canvasEl.toDataURL('image/webp', 0.9);
                  window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: dataUrl, w: canvasEl.width, h: canvasEl.height }, '*');
                  return;
                } catch (e2) {}
              }
              window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: null }, '*');
              return;
            }
            const clone = svg.cloneNode(true);
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
            let svgW = parseFloat(svg.getAttribute('width')) || 0;
            let svgH = parseFloat(svg.getAttribute('height')) || 0;
            if ((!svgW || !svgH) && svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
              svgW = svg.viewBox.baseVal.width;
              svgH = svg.viewBox.baseVal.height;
            }
            if (!svgW || !svgH) {
              const r = svg.getBoundingClientRect();
              svgW = r.width || 400;
              svgH = r.height || 300;
            }
            clone.setAttribute('width', String(svgW));
            clone.setAttribute('height', String(svgH));
            const serialized = new XMLSerializer().serializeToString(clone);
            const blob = new Blob([serialized], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = function() {
              try {
                const scale = Math.min(1, 2048 / Math.max(1, svgW), 2048 / Math.max(1, svgH));
                const cw = Math.max(1, Math.round(svgW * scale));
                const ch = Math.max(1, Math.round(svgH * scale));
                const canvas = document.createElement('canvas');
                canvas.width = cw;
                canvas.height = ch;
                const ctx2d = canvas.getContext('2d');
                ctx2d.drawImage(img, 0, 0, cw, ch);
                URL.revokeObjectURL(url);
                const dataUrl = canvas.toDataURL('image/webp', 0.9);
                window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: dataUrl, w: svgW, h: svgH }, '*');
              } catch(e2) {
                URL.revokeObjectURL(url);
                window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: null }, '*');
              }
            };
            img.onerror = function() {
              URL.revokeObjectURL(url);
              window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: null }, '*');
            };
            img.src = url;
          } catch(e) {
            window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: null }, '*');
          }
        }

        window.addEventListener('message', function(ev) {
          if (ev.data && ev.data.type === 'drawva-widget-snapshot-request') {
            postSnapshot(ev.data.reqId);
          } else if (ev.data && ev.data.type === 'drawva-widget-layout-size') {
            const w = Number(ev.data.width), h = Number(ev.data.height);
            if (w >= 80 && w <= 3200 && h >= 60 && h <= 6000) {
              document.documentElement.style.setProperty('--drawva-layout-width', w + 'px');
              document.documentElement.style.setProperty('--drawva-layout-height', h + 'px');
              window.dispatchEvent(new CustomEvent('drawva-widget-layout', { detail: { width: w, height: h } }));
              scheduleSize();
            }
          }
        });

        window.addEventListener('DOMContentLoaded', postSize);
        window.addEventListener('load', postSize);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(postSize).catch(function() {});
        }
        if (typeof ResizeObserver !== 'undefined') {
          try {
            const ro = new ResizeObserver(scheduleSize);
            if (document.body) ro.observe(document.body);
            if (document.documentElement) ro.observe(document.documentElement);
          } catch(e) {}
        }
        if (typeof MutationObserver !== 'undefined' && document.body) {
          try {
            const mo = new MutationObserver(scheduleSize);
            mo.observe(document.body, { childList: true, subtree: true });
          } catch(e) {}
        }

        window.addEventListener('wheel', function(e) {
          e.preventDefault();
          window.parent.postMessage({
            type: 'drawva-widget-inner-wheel',
            clientX: e.clientX,
            clientY: e.clientY,
            deltaX: e.deltaX,
            deltaY: e.deltaY,
            ctrlKey: !!e.ctrlKey,
            metaKey: !!e.metaKey,
            deltaMode: e.deltaMode || 0
          }, '*');
        }, { passive: false });

        window.addEventListener('pointerdown', function(e) {
          window.parent.postMessage({
            type: 'drawva-widget-inner-pointerdown'
          }, '*');
        }, true);

        setTimeout(scheduleSize, 30);
        setTimeout(scheduleSize, 120);
        setTimeout(scheduleSize, 300);
        setTimeout(scheduleSize, 600);
        setTimeout(scheduleSize, 1200);
        // Auto-snapshot after chart likely rendered
        setTimeout(function() { postSnapshot('auto'); }, 900);
        setTimeout(function() { postSnapshot('auto'); }, 2200);
      })();
    <\/script>`;

    const transparentBase = '<style>html,body{background:transparent!important;overflow:visible!important;margin:0!important;padding:0;box-sizing:border-box;width:max-content;min-width:0;max-width:none;height:auto;min-height:0;touch-action:none!important;overscroll-behavior:contain!important}body:not(:has(#stage)){padding:8px!important}body:not(:has(#stage)),body:not(:has(#stage)) *{box-shadow:none!important}#stage{width:max-content;max-width:none;height:auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}::-webkit-scrollbar{display:none!important}</style>' + autoResizeScript;
    const source = /<\/head>/i.test(html)
      ? html.replace(/<\/head>/i, transparentBase + '</head>')
      : transparentBase + html;
    inner.srcdoc = source;
  }

  function forward(msg) {
    if (parentOrigin) parent.postMessage(msg, parentOrigin);
  }
  // Fallback for snapshots/wheel if origin not pinned. Never used for content.
  const postAnywhere = (msg) => parent.postMessage(msg, "*");

  addEventListener("message", (event) => {
    const data = event.data;
    if (!data || typeof data !== "object") return;
    const fromParent = event.source === parent;
    const fromInner = event.source === inner.contentWindow;
    if (data.type === "drawva-widget-init") {
      if (!fromParent) return;
      if (typeof data.html !== "string" || data.html.length > MAX_HTML_LENGTH) return;
      writeInner(data.html);
    } else if (data.type === "drawva-widget-state") {
      if (!fromParent) return;
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-state", selected: !!data.selected, active: !!data.active }, "*");
    } else if (data.type === "drawva-widget-layout-size") {
      if (!fromParent || !Number.isFinite(data.width) || !Number.isFinite(data.height) || data.width < 80 || data.width > 3200 || data.height < 60 || data.height > 6000) return;
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-layout-size", width: Math.round(data.width), height: Math.round(data.height) }, "*");
    } else if (data.type === "drawva-widget-resize-content") {
      if (!fromInner || !Number.isFinite(data.width) || !Number.isFinite(data.height) || data.width < 80 || data.width > 3200 || data.height < 60 || data.height > 6000) return;
      forward({ type: "drawva-widget-settled-size", width: Math.round(data.width), height: Math.round(data.height) });
    } else if (data.type === "drawva-widget-inner-wheel") {
      if (!fromInner) return;
      postAnywhere({
        type: "drawva-widget-wheel",
        clientX: data.clientX,
        clientY: data.clientY,
        deltaX: data.deltaX,
        deltaY: data.deltaY,
        ctrlKey: !!data.ctrlKey,
        metaKey: !!data.metaKey,
        deltaMode: data.deltaMode || 0
      });
    } else if (data.type === "drawva-widget-inner-pointerdown") {
      if (!fromInner) return;
      postAnywhere({ type: "drawva-widget-pointerdown" });
    } else if (data.type === "drawva-widget-updated") {
      if (!fromInner) return;
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-snapshot-request", reqId: "updated" }, "*");
    } else if (data.type === "drawva-widget-snapshot-request") {
      if (!fromParent) return;
      // Forward snapshot request into the inner iframe
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-snapshot-request", reqId: data.reqId }, "*");
    } else if (data.type === "drawva-widget-inner-snapshot") {
      if (!fromInner) return;
      // Forward snapshot response from inner iframe up to parent
      postAnywhere({ type: "drawva-widget-snapshot", reqId: data.reqId, dataUrl: data.dataUrl, w: data.w, h: data.h });
    }
  });

  // Forward wheel from inside the host so the parent canvas still pans/zooms.
  addEventListener("wheel", (ev) => {
    ev.preventDefault();
    postAnywhere({
      type: "drawva-widget-wheel",
      clientX: ev.clientX,
      clientY: ev.clientY,
      deltaX: ev.deltaX,
      deltaY: ev.deltaY,
      ctrlKey: !!ev.ctrlKey,
      metaKey: !!ev.metaKey,
      deltaMode: ev.deltaMode || 0
    });
  }, { passive: false });

  // Forward pointerdown from inside the host so parent WidgetManager selects this widget on click.
  addEventListener("pointerdown", () => {
    postAnywhere({ type: "drawva-widget-pointerdown" });
  }, true);

  forward({ type: "drawva-widget-host-ready" });
})();
</script>
</body>
</html>
