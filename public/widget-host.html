<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawva widget host</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    iframe { width: 100%; height: 100%; display: block; border: 0; background: transparent !important; touch-action: none; }
  </style>
</head>
<body>
<script>
"use strict";
// Drawva widget host. Runs inside a sandboxed outer iframe and renders untrusted
// widget HTML inside a NO-SAME-ORIGIN inner iframe. Parent communicates via
// postMessage; the parent origin is validated before any reply is sent.
(() => {
  const MAX_HTML_LENGTH = 200000;
  const MAX_SNAPSHOT_DIMENSION = 4000;
  const MAX_SNAPSHOT_PIXELS = 12000000;
  const MAX_SNAPSHOT_DATA_URL = 28 * 1024 * 1024;

  const requestedParentOrigin = new URL(location.href).searchParams.get("parent-origin");
  let parentOrigin = null;
  try {
    const u = new URL(requestedParentOrigin);
    if (u.origin === requestedParentOrigin) parentOrigin = u.origin;
  } catch {}
  if (!parentOrigin) parentOrigin = location.origin; // same-origin fallback (dev)

  const inner = document.createElement("iframe");
  inner.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  inner.setAttribute("title", "canvas widget");
  inner.setAttribute("referrerpolicy", "no-referrer");
  document.body.append(inner);

  function writeInner(html) {
    const autoResizeScript = `<script>
      (function() {
        let lastH = 0;
        let lastW = 0;

        function postSize() {
          try {
            const body = document.body;
            const docEl = document.documentElement;
            if (!body || !docEl) return;

            const bodyRect = body.getBoundingClientRect();
            let maxRight = 0;
            let maxBottom = 0;

            // 1. Measure SVG elements accurately using their viewBox / getBBox
            const svgs = body.querySelectorAll('svg');
            for (let i = 0; i < svgs.length; i++) {
              const svg = svgs[i];
              try {
                let svgW = 0, svgH = 0;
                const g = svg.querySelector('g');
                if (g && g.getBBox) {
                  const gb = g.getBBox();
                  if (gb && gb.width > 10 && gb.height > 10) {
                    svgW = gb.width + (gb.x > 0 ? gb.x : 0);
                    svgH = gb.height + (gb.y > 0 ? gb.y : 0);
                  }
                }
                if ((!svgW || !svgH) && svg.viewBox && svg.viewBox.baseVal) {
                  svgW = svg.viewBox.baseVal.width;
                  svgH = svg.viewBox.baseVal.height;
                }
                if (!svgW && svg.getAttribute('viewBox')) {
                  const vb = svg.getAttribute('viewBox').split(/[\\s,]+/).map(Number);
                  if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
                    svgW = vb[2];
                    svgH = vb[3];
                  }
                }

                if (svgW > 10 && svgH > 10) {
                  const svgRect = svg.getBoundingClientRect();
                  const svgTop = svgRect.top - bodyRect.top;
                  const svgLeft = svgRect.left - bodyRect.left;
                  const renderedW = svgRect.width > 0 ? svgRect.width : svgW;
                  const aspect = svgH / svgW;
                  const renderedH = Math.min(svgRect.height > 0 ? svgRect.height : svgH, renderedW * aspect);

                  if (svgLeft + renderedW > maxRight) maxRight = svgLeft + renderedW;
                  if (svgTop + renderedH > maxBottom) maxBottom = svgTop + renderedH;
                }
              } catch(e) {}
            }

            // 2. Measure visible HTML content elements
            const allElements = body.querySelectorAll('h1, h2, h3, h4, h5, h6, p, span, a, label, button, input, select, textarea, img, canvas, table, tr, td, th, pre, code, ul, ol, li, form, section, article, .card, [class*="card"], [class*="container"], [class*="box"], [style*="border"]');
            for (let i = 0; i < allElements.length; i++) {
              const el = allElements[i];
              if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'LINK' || el.tagName === 'META') continue;
              const rect = el.getBoundingClientRect();
              if (rect.width > 0 && rect.height > 0) {
                const r = rect.right - bodyRect.left;
                const b = rect.bottom - bodyRect.top;
                const isFullStretchBlock = (rect.width >= bodyRect.width - 8) && (el.tagName === 'DIV' || el.tagName === 'SECTION' || el.tagName === 'BODY');
                if (r > maxRight && !isFullStretchBlock) {
                  maxRight = r;
                }
                if (b > maxBottom) {
                  maxBottom = b;
                }
              }
            }

            // 3. Check first container explicit widths
            const contentElements = Array.from(body.children).filter(function(el) {
              return el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE' && el.tagName !== 'LINK' && el.tagName !== 'META';
            });
            const first = contentElements[0] || body.firstElementChild || body;
            const firstStyle = window.getComputedStyle(first);
            const hasMaxWidth = firstStyle.maxWidth && firstStyle.maxWidth !== 'none' && !firstStyle.maxWidth.endsWith('%');
            const hasExplicitWidth = firstStyle.width && !firstStyle.width.endsWith('%') && firstStyle.width !== 'auto';

            if (hasMaxWidth || hasExplicitWidth) {
              const firstRect = first.getBoundingClientRect();
              if (firstRect.width > maxRight) maxRight = firstRect.width;
            }

            const contentH = Math.max(maxBottom, Math.ceil(first.getBoundingClientRect().height || 0));
            const contentW = Math.max(maxRight, Math.ceil(first.getBoundingClientRect().width || 0));

            let targetW = Math.min(3200, Math.max(220, Math.ceil(contentW + 16)));
            let targetH = Math.min(6000, Math.max(120, Math.ceil(contentH + 16)));

            if (Math.abs(targetH - lastH) > 4 || Math.abs(targetW - lastW) > 4) {
              lastH = targetH;
              lastW = targetW;
              window.parent.postMessage({
                type: 'drawva-widget-resize-content',
                width: targetW,
                height: targetH
              }, '*');
            }
          } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', postSize);
        window.addEventListener('load', postSize);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(postSize).catch(function() {});
        }
        if (typeof ResizeObserver !== 'undefined') {
          try {
            const ro = new ResizeObserver(postSize);
            if (document.body) ro.observe(document.body);
            if (document.documentElement) ro.observe(document.documentElement);
          } catch(e) {}
        }
        if (typeof MutationObserver !== 'undefined' && document.body) {
          try {
            const mo = new MutationObserver(postSize);
            mo.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
          } catch(e) {}
        }

        window.addEventListener('wheel', function(e) {
          e.preventDefault();
          window.parent.postMessage({
            type: 'drawva-widget-inner-wheel',
            clientX: e.clientX,
            clientY: e.clientY,
            deltaX: e.deltaX,
            deltaY: e.deltaY
          }, '*');
        }, { passive: false });

        window.addEventListener('pointerdown', function(e) {
          window.parent.postMessage({
            type: 'drawva-widget-inner-pointerdown'
          }, '*');
        }, true);

        setTimeout(postSize, 30);
        setTimeout(postSize, 120);
        setTimeout(postSize, 300);
        setTimeout(postSize, 600);
        setTimeout(postSize, 1200);
      })();
    <\/script>`;

    const transparentBase = '<style>html,body{background:transparent!important;overflow:hidden!important;margin:0!important;padding:6px 8px 12px 8px;box-sizing:border-box;width:100%!important;height:auto!important;min-height:0!important}::-webkit-scrollbar{display:none!important}</style>' + autoResizeScript;
    const source = /<\/head>/i.test(html)
      ? html.replace(/<\/head>/i, transparentBase + '</head>')
      : transparentBase + html;
    inner.srcdoc = source;
  }

  function forward(msg) {
    if (parentOrigin) parent.postMessage(msg, parentOrigin);
  }
  // Fallback for snapshots/wheel if origin not pinned. Never used for content.
  const postAnywhere = (msg) => parent.postMessage(msg, "*");

  addEventListener("message", (event) => {
    const data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "drawva-widget-init") {
      if (typeof data.html !== "string" || data.html.length > MAX_HTML_LENGTH) return;
      writeInner(data.html);
    } else if (data.type === "drawva-widget-state") {
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-state", selected: !!data.selected, active: !!data.active }, "*");
    } else if (data.type === "drawva-widget-resize-content") {
      forward({ type: "drawva-widget-resize-content", width: data.width, height: data.height });
    } else if (data.type === "drawva-widget-inner-wheel") {
      postAnywhere({
        type: "drawva-widget-wheel",
        clientX: data.clientX,
        clientY: data.clientY,
        deltaX: data.deltaX,
        deltaY: data.deltaY
      });
    } else if (data.type === "drawva-widget-inner-pointerdown") {
      postAnywhere({ type: "drawva-widget-pointerdown" });
    }
  });

  // Forward wheel from inside the host so the parent canvas still pans/zooms.
  addEventListener("wheel", (ev) => {
    ev.preventDefault();
    postAnywhere({
      type: "drawva-widget-wheel",
      clientX: ev.clientX,
      clientY: ev.clientY,
      deltaX: ev.deltaX,
      deltaY: ev.deltaY
    });
  }, { passive: false });

  // Forward pointerdown from inside the host so parent WidgetManager selects this widget on click.
  addEventListener("pointerdown", () => {
    postAnywhere({ type: "drawva-widget-pointerdown" });
  }, true);

  forward({ type: "drawva-widget-host-ready" });
})();
</script>
</body>
</html>
