<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawva widget host</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    iframe { width: 100%; height: 100%; display: block; border: 0; background: transparent !important; touch-action: none; }
  </style>
</head>
<body>
<script>
"use strict";
(() => {
  const MAX_HTML_LENGTH = 200000;
  const MAX_THEME_TOKENS = 48;
  const MAX_THEME_VALUE_LENGTH = 120;
  const THEME_TOKEN_PATTERN = /^[a-z0-9-]{1,32}$/;
  const THEME_VALUE_BLOCKLIST = /[;{}<>\\]|\/\*|@|url\s*\(/i;

  const THEME_DERIVED =
    "--radius-sm:calc(var(--radius) * 0.6);" +
    "--radius-md:calc(var(--radius) * 0.8);" +
    "--radius-lg:var(--radius);" +
    "--radius-xl:calc(var(--radius) * 1.4);" +
    "--radius-2xl:calc(var(--radius) * 1.8);" +
    "--radius-3xl:calc(var(--radius) * 2.2);" +
    "--radius-4xl:calc(var(--radius) * 2.6);";

  let currentTheme = null;
  let writtenThemeJson = null;

  function sanitizeTheme(theme) {
    if (!theme || typeof theme !== "object") return null;
    const entries = Object.keys(theme).slice(0, MAX_THEME_TOKENS);
    const clean = {};
    let count = 0;
    for (const token of entries) {
      if (!THEME_TOKEN_PATTERN.test(token)) continue;
      const raw = theme[token];
      if (typeof raw !== "string") continue;
      const value = raw.trim();
      if (!value || value.length > MAX_THEME_VALUE_LENGTH) continue;
      if (THEME_VALUE_BLOCKLIST.test(value)) continue;
      clean[token] = value;
      count++;
    }
    return count ? clean : null;
  }

  function themeStyleTag() {
    if (!currentTheme) return "";
    const declarations = Object.keys(currentTheme)
      .map((token) => "--" + token + ":" + currentTheme[token])
      .join(";");
    if (!declarations) return "";
    return (
      "<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');" +
      ":root{" + declarations + ";" + THEME_DERIVED + "}" +
      (currentTheme.foreground ? ":where(body){color:var(--foreground)}" : "") +
      "</style>"
    );
  }

  const requestedParentOrigin = new URL(location.href).searchParams.get("parent-origin");
  let parentOrigin = null;
  try {
    const u = new URL(requestedParentOrigin);
    if (u.origin === requestedParentOrigin) parentOrigin = u.origin;
  } catch {}
  if (!parentOrigin) parentOrigin = location.origin;

  const inner = document.createElement("iframe");
  inner.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  inner.setAttribute("title", "canvas widget");
  inner.setAttribute("referrerpolicy", "no-referrer");
  document.body.append(inner);

  function writeInner(html) {
    const autoResizeScript = `<script>
      (function() {
        var runtimeActive = true;
        var pendingAnimationFrames = new Map();
        var nativeAnimationFrames = new Map();
        var pausedAnimations = new WeakSet();
        var pausedSvgRoots = new WeakSet();
        var nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
        var nativeCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
        var nextAnimationFrameId = 1;

        function scheduleAnimationFrame(id) {
          var callback = pendingAnimationFrames.get(id);
          if (!callback || !runtimeActive || nativeAnimationFrames.has(id)) return;
          var nativeId = nativeRequestAnimationFrame(function(timestamp) {
            nativeAnimationFrames.delete(id);
            if (!runtimeActive || !pendingAnimationFrames.has(id)) return;
            pendingAnimationFrames.delete(id);
            callback(timestamp);
          });
          nativeAnimationFrames.set(id, nativeId);
        }

        window.requestAnimationFrame = function(callback) {
          if (typeof callback !== 'function') throw new TypeError('Callback must be a function');
          var id = nextAnimationFrameId++;
          pendingAnimationFrames.set(id, callback);
          scheduleAnimationFrame(id);
          return id;
        };

        window.cancelAnimationFrame = function(id) {
          pendingAnimationFrames.delete(id);
          var nativeId = nativeAnimationFrames.get(id);
          if (nativeId === undefined) return;
          nativeAnimationFrames.delete(id);
          nativeCancelAnimationFrame(nativeId);
        };

        function setRuntimeActive(active) {
          if (runtimeActive !== active) {
            runtimeActive = active;
            if (active) {
              for (var id of pendingAnimationFrames.keys()) scheduleAnimationFrame(id);
            } else {
              for (var nativeId of nativeAnimationFrames.values()) nativeCancelAnimationFrame(nativeId);
              nativeAnimationFrames.clear();
            }
          }
          if (active) {
            document.documentElement.classList.remove('drawva-widget-paused');
            if (document.getAnimations) {
              try {
                var anims = document.getAnimations();
                for (var i = 0; i < anims.length; i++) {
                  var a = anims[i];
                  if (!pausedAnimations.has(a)) continue;
                  pausedAnimations.delete(a);
                  try { a.play(); } catch (e) {}
                }
              } catch (e) {}
            }
            var svgs = document.querySelectorAll('svg');
            for (var j = 0; j < svgs.length; j++) {
              var svg = svgs[j];
              if (!pausedSvgRoots.has(svg)) continue;
              pausedSvgRoots.delete(svg);
              try { svg.unpauseAnimations(); } catch (e) {}
            }
            return;
          }
          if (document.getAnimations) {
            try {
              var anims = document.getAnimations();
              for (var i = 0; i < anims.length; i++) {
                var a = anims[i];
                if (a.playState !== 'running') continue;
                try {
                  a.pause();
                  pausedAnimations.add(a);
                } catch (e) {}
              }
            } catch (e) {}
          }
          var svgs = document.querySelectorAll('svg');
          for (var j = 0; j < svgs.length; j++) {
            var svg = svgs[j];
            if (typeof svg.pauseAnimations !== 'function') continue;
            try {
              svg.pauseAnimations();
              pausedSvgRoots.add(svg);
            } catch (e) {}
          }
          document.documentElement.classList.add('drawva-widget-paused');
        }

        function postSnapshotResult(reqId, dataUrl, w, h) {
          window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: dataUrl, w: w, h: h }, '*');
        }

        function svgNaturalSize(svg) {
          var r = svg.getBoundingClientRect();
          var w = parseFloat(svg.getAttribute('width')) || 0;
          var h = parseFloat(svg.getAttribute('height')) || 0;
          if ((!w || !h) && svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
            w = svg.viewBox.baseVal.width;
            h = svg.viewBox.baseVal.height;
          }
          if (!w || !h) {
            w = r.width || 400;
            h = r.height || 300;
          }
          return { w: w, h: h, r: r };
        }

        function cloneLiveSvg(svg) {
          var clone = svg.cloneNode(true);
          clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
          var nat = svgNaturalSize(svg);
          clone.setAttribute('width', String(nat.w));
          clone.setAttribute('height', String(nat.h));
          var css = Array.from(document.querySelectorAll('style')).map(function(s) { return s.textContent || ''; }).join('\n');
          if (css.trim()) {
            var styleTag = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            styleTag.textContent = css;
            clone.insertBefore(styleTag, clone.firstChild);
          }
          return clone;
        }

        function svgToImage(svg) {
          return new Promise(function(resolve) {
            try {
              var clone = cloneLiveSvg(svg);
              var serialized = new XMLSerializer().serializeToString(clone);
              var blob = new Blob([serialized], { type: 'image/svg+xml;charset=utf-8' });
              var url = URL.createObjectURL(blob);
              var img = new Image();
              img.onload = function() { URL.revokeObjectURL(url); resolve(img); };
              img.onerror = function() { URL.revokeObjectURL(url); resolve(null); };
              img.src = url;
            } catch (e) {
              resolve(null);
            }
          });
        }

        function isInsideSvg(el) {
          var p = el.parentElement;
          while (p) {
            if (p.tagName === 'svg' || p.tagName === 'SVG') return true;
            p = p.parentElement;
          }
          return false;
        }

        function pageSize() {
          var root = document.documentElement;
          var body = document.body;
          var w = Math.max(1, Math.ceil(Math.max(root.scrollWidth, root.clientWidth, body ? body.scrollWidth : 0)));
          var h = Math.max(1, Math.ceil(Math.max(root.scrollHeight, root.clientHeight, body ? body.scrollHeight : 0)));
          return { w: w, h: h };
        }

         function postContentSize() {
          try {
            var de = document.documentElement;
            var body = document.body;
            var neededW = Math.max(de.scrollWidth, body ? body.scrollWidth : 0);
            var neededH = Math.max(de.scrollHeight, body ? body.scrollHeight : 0);
            if (neededW > 0 && neededH > 0) {
              window.parent.postMessage({
                type: 'drawva-widget-inner-content-size',
                width: neededW,
                height: neededH
              }, '*');
            }
           } catch (e) {}
         }

         var adaptiveLayout = { width: 0, height: 0, factor: 1 };
         function adaptHtmlTypography(width, height) {
           if (document.querySelector('svg, canvas')) return;
           var elements = document.querySelectorAll('body *');
           var sizes = [];
           for (var i = 0; i < elements.length; i++) {
             var element = elements[i];
             if (!element.textContent || !element.textContent.trim()) continue;
             var rect = element.getBoundingClientRect();
             if (rect.width < 2 || rect.height < 2) continue;
             var size = parseFloat(getComputedStyle(element).fontSize);
             if (Number.isFinite(size) && size >= 8 && size <= 80) sizes.push(size);
           }
           if (!sizes.length) return;
           sizes.sort(function(a, b) { return a - b; });
           var current = sizes[Math.floor(sizes.length / 2)];
           var target = Math.max(18, Math.min(38, Math.min(width, height) * 0.055));
           var factor = current < target * 0.82 ? Math.max(1, Math.min(2.6, target / current)) : 1;
           if (adaptiveLayout.width === width && adaptiveLayout.height === height && adaptiveLayout.factor === factor) return;
           adaptiveLayout = { width: width, height: height, factor: factor };
           document.documentElement.style.setProperty('--drawva-widget-scale', String(factor));
           setTimeout(postContentSize, 0);
         }
         setTimeout(postContentSize, 120);

        function canvasToDataUrl(canvas) {
          try {
            return canvas.toDataURL('image/webp', 0.92);
          } catch (e) {
            try { return canvas.toDataURL('image/png'); } catch (e2) { return null; }
          }
        }

        async function rasterizeSingleSvg(svg) {
          var nat = svgNaturalSize(svg);
          var img = await svgToImage(svg);
          if (!img) return null;
          var scale = Math.min(2, 2048 / Math.max(1, nat.w), 2048 / Math.max(1, nat.h));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(nat.w * scale));
          canvas.height = Math.max(1, Math.round(nat.h * scale));
          var ctx2d = canvas.getContext('2d');
          ctx2d.drawImage(img, 0, 0, canvas.width, canvas.height);
          return { canvas: canvas, w: nat.w, h: nat.h };
        }

        async function rasterizeDocument() {
          var page = pageSize();
          var scale = Math.min(2, 2048 / page.w, 2048 / page.h);
          if (page.w * scale * page.h * scale > 12000000) {
            scale = Math.sqrt(12000000 / Math.max(1, page.w * page.h));
          }
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(page.w * scale));
          canvas.height = Math.max(1, Math.round(page.h * scale));
          var ctx2d = canvas.getContext('2d');
          ctx2d.scale(scale, scale);

          var svgs = document.querySelectorAll('svg');
          for (var s = 0; s < svgs.length; s++) {
            var svg = svgs[s];
            if (isInsideSvg(svg)) continue;
            var r = svg.getBoundingClientRect();
            if (r.width <= 1 || r.height <= 1) continue;
            var img = await svgToImage(svg);
            if (img) ctx2d.drawImage(img, r.left, r.top, r.width, r.height);
          }

          var canvases = document.querySelectorAll('canvas');
          for (var c = 0; c < canvases.length; c++) {
            var el = canvases[c];
            var r = el.getBoundingClientRect();
            if (r.width <= 1 || r.height <= 1) continue;
            try { ctx2d.drawImage(el, r.left, r.top, r.width, r.height); } catch (e) {}
          }

          var images = document.querySelectorAll('img');
          for (var m = 0; m < images.length; m++) {
            var el = images[m];
            if (!el.naturalWidth) continue;
            var r = el.getBoundingClientRect();
            if (r.width <= 1 || r.height <= 1) continue;
            try { ctx2d.drawImage(el, r.left, r.top, r.width, r.height); } catch (e) {}
          }

          return { canvas: canvas, w: page.w, h: page.h };
        }

        function postSnapshot(reqId) {
          snapshotLive(reqId).catch(function() {
            postSnapshotResult(reqId, null, 0, 0);
          });
        }

        async function snapshotLive(reqId) {
          var svgs = document.querySelectorAll('svg');
          var canvases = document.querySelectorAll('canvas');
          var imgs = document.querySelectorAll('img');
          var extra = canvases.length + imgs.length;
          var shot = null;
          if (svgs.length === 1 && extra === 0) {
            shot = await rasterizeSingleSvg(svgs[0]);
          } else if (svgs.length === 0 && canvases.length === 1 && imgs.length === 0) {
            var el = canvases[0];
            if (el.width > 2 && el.height > 2) {
              postSnapshotResult(reqId, canvasToDataUrl(el), el.width, el.height);
              return;
            }
          }
          if (!shot) shot = await rasterizeDocument();
          if (!shot || !shot.canvas) {
            postSnapshotResult(reqId, null, 0, 0);
            return;
          }
          var dataUrl = canvasToDataUrl(shot.canvas);
          if (!dataUrl || dataUrl.length > 28 * 1024 * 1024) {
            postSnapshotResult(reqId, null, 0, 0);
            return;
          }
          postSnapshotResult(reqId, dataUrl, shot.w, shot.h);
        }

        window.addEventListener('message', function(ev) {
          if (!ev.data) return;
          if (ev.data.type === 'drawva-widget-snapshot-request') {
            postSnapshot(ev.data.reqId);
          } else if (ev.data.type === 'drawva-widget-check-size') {
            postContentSize();
          } else if (ev.data.type === 'drawva-widget-theme') {
            var theme = ev.data.theme;
            if (!theme || typeof theme !== 'object') return;
            var root = document.documentElement;
            for (var key in theme) {
              if (!Object.prototype.hasOwnProperty.call(theme, key)) continue;
              if (typeof theme[key] !== 'string') continue;
              try { root.style.setProperty('--' + key, theme[key]); } catch (e) {}
            }
          } else if (ev.data.type === 'drawva-widget-state') {
            if (typeof ev.data.active === 'boolean') {
              setRuntimeActive(ev.data.active);
            }
          } else if (ev.data.type === 'drawva-widget-layout-size') {
            var w = Number(ev.data.width), h = Number(ev.data.height);
            if (w >= 80 && w <= 3200 && h >= 60 && h <= 6000) {
              document.documentElement.style.setProperty('--drawva-layout-width', w + 'px');
               document.documentElement.style.setProperty('--drawva-layout-height', h + 'px');
               window.dispatchEvent(new CustomEvent('drawva-widget-layout', { detail: { width: w, height: h } }));
               adaptHtmlTypography(w, h);
             }
          }
        });

        window.addEventListener('wheel', function(e) {
          e.preventDefault();
          window.parent.postMessage({
            type: 'drawva-widget-inner-wheel',
            clientX: e.clientX,
            clientY: e.clientY,
            deltaX: e.deltaX,
            deltaY: e.deltaY,
            ctrlKey: !!e.ctrlKey,
            metaKey: !!e.metaKey,
            deltaMode: e.deltaMode || 0
          }, '*');
        }, { passive: false });

        window.addEventListener('pointerdown', function() {
          window.parent.postMessage({
            type: 'drawva-widget-inner-pointerdown'
          }, '*');
        }, true);
      })();
    <\/script>`;

    const transparentBase = '<style>html{background:transparent!important;overflow:hidden!important;margin:0!important;padding:0!important;box-sizing:border-box;width:100%!important;height:100%!important;container-type:size;}body{background:transparent!important;margin:0!important;padding:0!important;width:100%!important;height:100%!important;min-width:0;min-height:0;box-sizing:border-box;touch-action:none!important;overscroll-behavior:contain!important}#stage{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box;margin:0}#stage svg,#stage canvas{display:block;margin:auto;max-width:100%;max-height:100%}::-webkit-scrollbar{display:none!important}.drawva-widget-paused *,.drawva-widget-paused *::before,.drawva-widget-paused *::after{animation-play-state:paused!important;transition:none!important;}</style>' + autoResizeScript;
    const injected = themeStyleTag() + transparentBase;
    writtenThemeJson = currentTheme ? JSON.stringify(currentTheme) : null;
    const source = /<\/head>/i.test(html)
      ? html.replace(/<\/head>/i, injected + '</head>')
      : injected + html;
    inner.srcdoc = source;
  }

  function pushTheme() {
    if (!currentTheme || !inner.contentWindow) return;
    inner.contentWindow.postMessage({ type: "drawva-widget-theme", theme: currentTheme }, "*");
  }

  inner.addEventListener("load", () => {
    if (!currentTheme) return;
    if (JSON.stringify(currentTheme) === writtenThemeJson) return;
    pushTheme();
  });

  function forward(msg) {
    if (parentOrigin) parent.postMessage(msg, parentOrigin);
  }
  const postAnywhere = (msg) => parent.postMessage(msg, "*");

  addEventListener("message", (event) => {
    const data = event.data;
    if (!data || typeof data !== "object") return;
    const fromParent = event.source === parent;
    const fromInner = event.source === inner.contentWindow;
    if (data.type === "drawva-widget-init") {
      if (!fromParent) return;
      if (typeof data.html !== "string" || data.html.length > MAX_HTML_LENGTH) return;
      const initTheme = sanitizeTheme(data.theme);
      if (initTheme) currentTheme = initTheme;
      writeInner(data.html);
    } else if (data.type === "drawva-widget-theme") {
      if (!fromParent) return;
      const nextTheme = sanitizeTheme(data.theme);
      if (!nextTheme) return;
      currentTheme = nextTheme;
      pushTheme();
    } else if (data.type === "drawva-widget-state") {
      if (!fromParent) return;
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-state", selected: !!data.selected, active: !!data.active }, "*");
    } else if (data.type === "drawva-widget-layout-size") {
      if (!fromParent || !Number.isFinite(data.width) || !Number.isFinite(data.height) || data.width < 80 || data.width > 3200 || data.height < 60 || data.height > 6000) return;
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-layout-size", width: Math.round(data.width), height: Math.round(data.height) }, "*");
    } else if (data.type === "drawva-widget-inner-wheel") {
      if (!fromInner) return;
      postAnywhere({
        type: "drawva-widget-wheel",
        clientX: data.clientX,
        clientY: data.clientY,
        deltaX: data.deltaX,
        deltaY: data.deltaY,
        ctrlKey: !!data.ctrlKey,
        metaKey: !!data.metaKey,
        deltaMode: data.deltaMode || 0
      });
    } else if (data.type === "drawva-widget-inner-pointerdown") {
      if (!fromInner) return;
      postAnywhere({ type: "drawva-widget-pointerdown" });
    } else if (data.type === "drawva-widget-updated") {
      if (!fromInner) return;
      forward({ type: "drawva-widget-updated" });
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-check-size" }, "*");
    } else if (data.type === "drawva-widget-snapshot-request") {
      if (!fromParent) return;
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-snapshot-request", reqId: data.reqId }, "*");
    } else if (data.type === "drawva-widget-inner-snapshot") {
      if (!fromInner) return;
      postAnywhere({ type: "drawva-widget-snapshot", reqId: data.reqId, dataUrl: data.dataUrl, w: data.w, h: data.h });
    } else if (data.type === "drawva-widget-inner-content-size") {
      if (!fromInner) return;
      const cw = Math.round(Number(data.width));
      const ch = Math.round(Number(data.height));
      if (!Number.isFinite(cw) || !Number.isFinite(ch) || cw < 40 || ch < 30) return;
      postAnywhere({ type: "drawva-widget-content-size", width: cw, height: ch });
    }
  });

  addEventListener("wheel", (ev) => {
    ev.preventDefault();
    postAnywhere({
      type: "drawva-widget-wheel",
      clientX: ev.clientX,
      clientY: ev.clientY,
      deltaX: ev.deltaX,
      deltaY: ev.deltaY,
      ctrlKey: !!ev.ctrlKey,
      metaKey: !!ev.metaKey,
      deltaMode: ev.deltaMode || 0
    });
  }, { passive: false });

  addEventListener("pointerdown", () => {
    postAnywhere({ type: "drawva-widget-pointerdown" });
  }, true);

  forward({ type: "drawva-widget-host-ready" });
})();
</script>
</body>
</html>
