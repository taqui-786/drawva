<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawva widget host</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    iframe { width: 100%; height: 100%; display: block; border: 0; background: transparent !important; touch-action: none; }
  </style>
</head>
<body>
<script>
"use strict";
// Drawva widget host. Runs inside a sandboxed outer iframe and renders untrusted
// widget HTML inside a NO-SAME-ORIGIN inner iframe. Parent communicates via
// postMessage; the parent origin is validated before any reply is sent.
(() => {
  const MAX_HTML_LENGTH = 200000;
  const MAX_SNAPSHOT_DIMENSION = 4000;
  const MAX_SNAPSHOT_PIXELS = 12000000;
  const MAX_SNAPSHOT_DATA_URL = 28 * 1024 * 1024;

  const requestedParentOrigin = new URL(location.href).searchParams.get("parent-origin");
  let parentOrigin = null;
  try {
    const u = new URL(requestedParentOrigin);
    if (u.origin === requestedParentOrigin) parentOrigin = u.origin;
  } catch {}
  if (!parentOrigin) parentOrigin = location.origin; // same-origin fallback (dev)

  const inner = document.createElement("iframe");
  inner.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  inner.setAttribute("title", "canvas widget");
  inner.setAttribute("referrerpolicy", "no-referrer");
  document.body.append(inner);

  function writeInner(html) {
    const autoResizeScript = `<script>
      (function() {
        let lastH = 0;
        let lastW = 0;

        function svgSize(svg) {
          if (!svg) return null;
          const vb = svg.viewBox && svg.viewBox.baseVal;
          if (vb && vb.width > 2 && vb.height > 2) return { w: vb.width, h: vb.height };
          const p = (svg.getAttribute('viewBox') || '').split(/[\\s,]+/).map(Number);
          if (p.length === 4 && p[2] > 2 && p[3] > 2) return { w: p[2], h: p[3] };
          const wAttr = parseFloat(svg.getAttribute('width') || '');
          const hAttr = parseFloat(svg.getAttribute('height') || '');
          if (wAttr > 2 && hAttr > 2 && !String(svg.getAttribute('width') || '').includes('%')) {
            return { w: wAttr, h: hAttr };
          }
          try {
            const r = svg.getBoundingClientRect();
            if (r.width > 2 && r.height > 2) return { w: r.width, h: r.height };
          } catch(e) {}
          return null;
        }

        function emitSize(width, height) {
          const w = Math.min(3200, Math.max(80, Math.ceil(width)));
          const h = Math.min(6000, Math.max(60, Math.ceil(height)));
          if (Math.abs(h - lastH) > 2 || Math.abs(w - lastW) > 2) {
            lastW = w;
            lastH = h;
            window.parent.postMessage({ type: 'drawva-widget-resize-content', width: w, height: h }, '*');
          }
        }

        function postSize() {
          try {
            const body = document.body;
            const root = document.documentElement;
            if (!body) return;
            const stage = document.getElementById('stage');
            if (stage && /^rendering\b/i.test((stage.textContent || '').trim()) && !stage.querySelector('svg, canvas, .vega-embed')) return;

            const svg = document.querySelector('#stage svg, .vega-embed svg, svg');
            const nat = svg && svgSize(svg);
            if (nat && !body.querySelector('input, button, table, section, article, ul, ol, form')) {
              emitSize(nat.w + 16, nat.h + 16);
              return;
            }

            const pad = 12;
            let right = 0;
            let bottom = 0;
            const nodes = body.querySelectorAll('*');
            for (let i = 0; i < nodes.length; i++) {
              const el = nodes[i];
              if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'LINK' || el.tagName === 'META') continue;
              const r = el.getBoundingClientRect();
              if (r.width <= 1 || r.height <= 1) continue;
              right = Math.max(right, r.right);
              bottom = Math.max(bottom, r.bottom);
            }
            const scrollW = Math.max(body.scrollWidth || 0, root.scrollWidth || 0, right);
            const scrollH = Math.max(body.scrollHeight || 0, root.scrollHeight || 0, bottom);
            if (scrollW < 8 || scrollH < 8) return;
            emitSize(scrollW + pad, scrollH + pad);
          } catch(e) {}
        }

        // ── Snapshot: serialize first SVG to a canvas data URL, post it back ──
        function postSnapshot(reqId) {
          try {
            const svg = document.querySelector('svg');
            if (!svg) {
              window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: null }, '*');
              return;
            }
            const clone = svg.cloneNode(true);
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
            let svgW = parseFloat(svg.getAttribute('width')) || 0;
            let svgH = parseFloat(svg.getAttribute('height')) || 0;
            if ((!svgW || !svgH) && svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
              svgW = svg.viewBox.baseVal.width;
              svgH = svg.viewBox.baseVal.height;
            }
            if (!svgW || !svgH) {
              const r = svg.getBoundingClientRect();
              svgW = r.width || 400;
              svgH = r.height || 300;
            }
            clone.setAttribute('width', String(svgW));
            clone.setAttribute('height', String(svgH));
            const serialized = new XMLSerializer().serializeToString(clone);
            const blob = new Blob([serialized], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = function() {
              try {
                const scale = Math.min(1, 2048 / Math.max(1, svgW), 2048 / Math.max(1, svgH));
                const cw = Math.max(1, Math.round(svgW * scale));
                const ch = Math.max(1, Math.round(svgH * scale));
                const canvas = document.createElement('canvas');
                canvas.width = cw;
                canvas.height = ch;
                const ctx2d = canvas.getContext('2d');
                ctx2d.drawImage(img, 0, 0, cw, ch);
                URL.revokeObjectURL(url);
                const dataUrl = canvas.toDataURL('image/webp', 0.9);
                window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: dataUrl, w: svgW, h: svgH }, '*');
              } catch(e2) {
                URL.revokeObjectURL(url);
                window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: null }, '*');
              }
            };
            img.onerror = function() {
              URL.revokeObjectURL(url);
              window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: null }, '*');
            };
            img.src = url;
          } catch(e) {
            window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: null }, '*');
          }
        }

        window.addEventListener('message', function(ev) {
          if (ev.data && ev.data.type === 'drawva-widget-snapshot-request') {
            postSnapshot(ev.data.reqId);
          }
        });

        window.addEventListener('DOMContentLoaded', postSize);
        window.addEventListener('load', postSize);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(postSize).catch(function() {});
        }
        if (typeof ResizeObserver !== 'undefined') {
          try {
            const ro = new ResizeObserver(postSize);
            if (document.body) ro.observe(document.body);
            if (document.documentElement) ro.observe(document.documentElement);
          } catch(e) {}
        }
        if (typeof MutationObserver !== 'undefined' && document.body) {
          try {
            const mo = new MutationObserver(postSize);
            mo.observe(document.body, { childList: true, subtree: true });
          } catch(e) {}
        }

        window.addEventListener('wheel', function(e) {
          e.preventDefault();
          window.parent.postMessage({
            type: 'drawva-widget-inner-wheel',
            clientX: e.clientX,
            clientY: e.clientY,
            deltaX: e.deltaX,
            deltaY: e.deltaY
          }, '*');
        }, { passive: false });

        window.addEventListener('pointerdown', function(e) {
          window.parent.postMessage({
            type: 'drawva-widget-inner-pointerdown'
          }, '*');
        }, true);

        setTimeout(postSize, 30);
        setTimeout(postSize, 120);
        setTimeout(postSize, 300);
        setTimeout(postSize, 600);
        setTimeout(postSize, 1200);
        // Auto-snapshot after chart likely rendered
        setTimeout(function() { postSnapshot('auto'); }, 900);
        setTimeout(function() { postSnapshot('auto'); }, 2200);
      })();
    <\/script>`;

    const transparentBase = '<style>html,body{background:transparent!important;overflow:visible!important;margin:0!important;padding:0;box-sizing:border-box;width:max-content;min-width:0;height:auto;min-height:0}body:not(:has(#stage)){padding:8px!important}body:not(:has(#stage)),body:not(:has(#stage)) *{box-shadow:none!important}#stage{width:max-content;max-width:none;height:auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}::-webkit-scrollbar{display:none!important}</style>' + autoResizeScript;
    const source = /<\/head>/i.test(html)
      ? html.replace(/<\/head>/i, transparentBase + '</head>')
      : transparentBase + html;
    inner.srcdoc = source;
  }

  function forward(msg) {
    if (parentOrigin) parent.postMessage(msg, parentOrigin);
  }
  // Fallback for snapshots/wheel if origin not pinned. Never used for content.
  const postAnywhere = (msg) => parent.postMessage(msg, "*");

  addEventListener("message", (event) => {
    const data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "drawva-widget-init") {
      if (typeof data.html !== "string" || data.html.length > MAX_HTML_LENGTH) return;
      writeInner(data.html);
    } else if (data.type === "drawva-widget-state") {
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-state", selected: !!data.selected, active: !!data.active }, "*");
    } else if (data.type === "drawva-widget-resize-content") {
      forward({ type: "drawva-widget-resize-content", width: data.width, height: data.height });
    } else if (data.type === "drawva-widget-inner-wheel") {
      postAnywhere({
        type: "drawva-widget-wheel",
        clientX: data.clientX,
        clientY: data.clientY,
        deltaX: data.deltaX,
        deltaY: data.deltaY
      });
    } else if (data.type === "drawva-widget-inner-pointerdown") {
      postAnywhere({ type: "drawva-widget-pointerdown" });
    } else if (data.type === "drawva-widget-updated") {
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-snapshot-request", reqId: "updated" }, "*");
    } else if (data.type === "drawva-widget-snapshot-request") {
      // Forward snapshot request into the inner iframe
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-snapshot-request", reqId: data.reqId }, "*");
    } else if (data.type === "drawva-widget-inner-snapshot") {
      // Forward snapshot response from inner iframe up to parent
      postAnywhere({ type: "drawva-widget-snapshot", reqId: data.reqId, dataUrl: data.dataUrl, w: data.w, h: data.h });
    }
  });

  // Forward wheel from inside the host so the parent canvas still pans/zooms.
  addEventListener("wheel", (ev) => {
    ev.preventDefault();
    postAnywhere({
      type: "drawva-widget-wheel",
      clientX: ev.clientX,
      clientY: ev.clientY,
      deltaX: ev.deltaX,
      deltaY: ev.deltaY
    });
  }, { passive: false });

  // Forward pointerdown from inside the host so parent WidgetManager selects this widget on click.
  addEventListener("pointerdown", () => {
    postAnywhere({ type: "drawva-widget-pointerdown" });
  }, true);

  forward({ type: "drawva-widget-host-ready" });
})();
</script>
</body>
</html>
