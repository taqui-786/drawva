<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawva widget host</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    iframe { width: 100%; height: 100%; display: block; border: 0; background: transparent !important; touch-action: none; }
  </style>
</head>
<body>
<script>
"use strict";
// Drawva widget host. Runs inside a sandboxed outer iframe and renders untrusted
// widget HTML inside a NO-SAME-ORIGIN inner iframe. Parent communicates via
// postMessage; the parent origin is validated before any reply is sent.
(() => {
  const MAX_HTML_LENGTH = 200000;
  const MAX_SNAPSHOT_DIMENSION = 4000;
  const MAX_SNAPSHOT_PIXELS = 12000000;
  const MAX_SNAPSHOT_DATA_URL = 28 * 1024 * 1024;

  const requestedParentOrigin = new URL(location.href).searchParams.get("parent-origin");
  let parentOrigin = null;
  try {
    const u = new URL(requestedParentOrigin);
    if (u.origin === requestedParentOrigin) parentOrigin = u.origin;
  } catch {}
  if (!parentOrigin) parentOrigin = location.origin; // same-origin fallback (dev)

  const inner = document.createElement("iframe");
  inner.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  inner.setAttribute("title", "canvas widget");
  inner.setAttribute("referrerpolicy", "no-referrer");
  document.body.append(inner);

  function writeInner(html) {
    const autoResizeScript = `<script>
      (function() {
        function postSnapshotResult(reqId, dataUrl, w, h) {
          window.parent.postMessage({ type: 'drawva-widget-inner-snapshot', reqId: reqId, dataUrl: dataUrl, w: w, h: h }, '*');
        }

        function svgNaturalSize(svg) {
          const r = svg.getBoundingClientRect();
          let w = parseFloat(svg.getAttribute('width')) || 0;
          let h = parseFloat(svg.getAttribute('height')) || 0;
          if ((!w || !h) && svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
            w = svg.viewBox.baseVal.width;
            h = svg.viewBox.baseVal.height;
          }
          if (!w || !h) {
            w = r.width || 400;
            h = r.height || 300;
          }
          return { w: w, h: h, r: r };
        }

        function cloneLiveSvg(svg) {
          const clone = svg.cloneNode(true);
          clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
          const nat = svgNaturalSize(svg);
          clone.setAttribute('width', String(nat.w));
          clone.setAttribute('height', String(nat.h));
          const css = Array.from(document.querySelectorAll('style')).map(function(s) { return s.textContent || ''; }).join('\\n');
          if (css.trim()) {
            const styleTag = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            styleTag.textContent = css;
            clone.insertBefore(styleTag, clone.firstChild);
          }
          return clone;
        }

        function svgToImage(svg) {
          return new Promise(function(resolve) {
            try {
              const clone = cloneLiveSvg(svg);
              const serialized = new XMLSerializer().serializeToString(clone);
              const blob = new Blob([serialized], { type: 'image/svg+xml;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const img = new Image();
              img.onload = function() { URL.revokeObjectURL(url); resolve(img); };
              img.onerror = function() { URL.revokeObjectURL(url); resolve(null); };
              img.src = url;
            } catch (e) {
              resolve(null);
            }
          });
        }

        function isInsideSvg(el) {
          var p = el.parentElement;
          while (p) {
            if (p.tagName === 'svg' || p.tagName === 'SVG') return true;
            p = p.parentElement;
          }
          return false;
        }

        function pageSize() {
          const root = document.documentElement;
          const body = document.body;
          const w = Math.max(1, Math.ceil(Math.max(root.scrollWidth, root.clientWidth, body ? body.scrollWidth : 0)));
          const h = Math.max(1, Math.ceil(Math.max(root.scrollHeight, root.clientHeight, body ? body.scrollHeight : 0)));
          return { w: w, h: h };
        }

        function canvasToDataUrl(canvas) {
          try {
            return canvas.toDataURL('image/webp', 0.92);
          } catch (e) {
            try { return canvas.toDataURL('image/png'); } catch (e2) { return null; }
          }
        }

        async function rasterizeSingleSvg(svg) {
          const nat = svgNaturalSize(svg);
          const img = await svgToImage(svg);
          if (!img) return null;
          const scale = Math.min(2, 2048 / Math.max(1, nat.w), 2048 / Math.max(1, nat.h));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(nat.w * scale));
          canvas.height = Math.max(1, Math.round(nat.h * scale));
          const ctx2d = canvas.getContext('2d');
          ctx2d.drawImage(img, 0, 0, canvas.width, canvas.height);
          return { canvas: canvas, w: nat.w, h: nat.h };
        }

        async function rasterizeDocument() {
          const page = pageSize();
          let scale = Math.min(2, 2048 / page.w, 2048 / page.h);
          if (page.w * scale * page.h * scale > 12000000) {
            scale = Math.sqrt(12000000 / Math.max(1, page.w * page.h));
          }
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(page.w * scale));
          canvas.height = Math.max(1, Math.round(page.h * scale));
          const ctx2d = canvas.getContext('2d');
          ctx2d.scale(scale, scale);

          const nodes = document.body ? document.body.querySelectorAll('*') : [];
          for (let i = 0; i < nodes.length; i++) {
            const el = nodes[i];
            if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'LINK') continue;
            if (isInsideSvg(el)) continue;
            const style = window.getComputedStyle(el);
            if (style.display === 'none' || style.visibility === 'hidden' || parseFloat(style.opacity || '1') === 0) continue;
            const r = el.getBoundingClientRect();
            if (r.width <= 0 || r.height <= 0) continue;
            const bg = style.backgroundColor;
            if (bg && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)') {
              ctx2d.fillStyle = bg;
              const radius = parseFloat(style.borderRadius) || 0;
              if (radius > 0 && ctx2d.roundRect) {
                ctx2d.beginPath();
                ctx2d.roundRect(r.left, r.top, r.width, r.height, radius);
                ctx2d.fill();
              } else {
                ctx2d.fillRect(r.left, r.top, r.width, r.height);
              }
            }
            const bw = parseFloat(style.borderTopWidth) || 0;
            if (bw > 0 && style.borderTopStyle !== 'none') {
              ctx2d.strokeStyle = style.borderTopColor || '#000';
              ctx2d.lineWidth = bw;
              ctx2d.strokeRect(r.left + bw / 2, r.top + bw / 2, r.width - bw, r.height - bw);
            }
          }

          const svgs = document.querySelectorAll('svg');
          for (let s = 0; s < svgs.length; s++) {
            const svg = svgs[s];
            if (isInsideSvg(svg)) continue;
            const r = svg.getBoundingClientRect();
            if (r.width <= 1 || r.height <= 1) continue;
            const img = await svgToImage(svg);
            if (img) ctx2d.drawImage(img, r.left, r.top, r.width, r.height);
          }

          const canvases = document.querySelectorAll('canvas');
          for (let c = 0; c < canvases.length; c++) {
            const el = canvases[c];
            const r = el.getBoundingClientRect();
            if (r.width <= 1 || r.height <= 1) continue;
            try { ctx2d.drawImage(el, r.left, r.top, r.width, r.height); } catch (e) {}
          }

          const images = document.querySelectorAll('img');
          for (let m = 0; m < images.length; m++) {
            const el = images[m];
            if (!el.naturalWidth) continue;
            const r = el.getBoundingClientRect();
            if (r.width <= 1 || r.height <= 1) continue;
            try { ctx2d.drawImage(el, r.left, r.top, r.width, r.height); } catch (e) {}
          }

          if (document.body) {
            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
            let node;
            while ((node = walker.nextNode())) {
              const parent = node.parentElement;
              if (!parent || parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE') continue;
              if (isInsideSvg(parent) || (parent.closest && parent.closest('svg'))) continue;
              const text = (node.textContent || '').replace(/\\s+/g, ' ').trim();
              if (!text) continue;
              const style = window.getComputedStyle(parent);
              if (style.display === 'none' || style.visibility === 'hidden') continue;
              const range = document.createRange();
              range.selectNodeContents(node);
              const r = range.getBoundingClientRect();
              if (r.width <= 0 || r.height <= 0) continue;
              ctx2d.font = (style.fontWeight || '400') + ' ' + (style.fontSize || '16px') + ' ' + (style.fontFamily || 'system-ui, sans-serif');
              ctx2d.fillStyle = style.color || '#0f172a';
              ctx2d.textBaseline = 'middle';
              ctx2d.fillText(text, r.left, r.top + r.height / 2);
            }
          }

          return { canvas: canvas, w: page.w, h: page.h };
        }

        function postSnapshot(reqId) {
          snapshotLive(reqId).catch(function() {
            postSnapshotResult(reqId, null, 0, 0);
          });
        }

        async function snapshotLive(reqId) {
          const svgs = document.querySelectorAll('svg');
          const canvases = document.querySelectorAll('canvas');
          const imgs = document.querySelectorAll('img');
          const extra = canvases.length + imgs.length;
          let shot = null;
          if (svgs.length === 1 && extra === 0) {
            shot = await rasterizeSingleSvg(svgs[0]);
          } else if (svgs.length === 0 && canvases.length === 1 && imgs.length === 0) {
            const el = canvases[0];
            if (el.width > 2 && el.height > 2) {
              postSnapshotResult(reqId, canvasToDataUrl(el), el.width, el.height);
              return;
            }
          }
          if (!shot) shot = await rasterizeDocument();
          if (!shot || !shot.canvas) {
            postSnapshotResult(reqId, null, 0, 0);
            return;
          }
          const dataUrl = canvasToDataUrl(shot.canvas);
          if (!dataUrl || dataUrl.length > 28 * 1024 * 1024) {
            postSnapshotResult(reqId, null, 0, 0);
            return;
          }
          postSnapshotResult(reqId, dataUrl, shot.w, shot.h);
        }

        window.addEventListener('message', function(ev) {
          if (ev.data && ev.data.type === 'drawva-widget-snapshot-request') {
            postSnapshot(ev.data.reqId);
          } else if (ev.data && ev.data.type === 'drawva-widget-layout-size') {
            const w = Number(ev.data.width), h = Number(ev.data.height);
            if (w >= 80 && w <= 3200 && h >= 60 && h <= 6000) {
              document.documentElement.style.setProperty('--drawva-layout-width', w + 'px');
              document.documentElement.style.setProperty('--drawva-layout-height', h + 'px');
              window.dispatchEvent(new CustomEvent('drawva-widget-layout', { detail: { width: w, height: h } }));
            }
          }
        });

        window.addEventListener('wheel', function(e) {
          e.preventDefault();
          window.parent.postMessage({
            type: 'drawva-widget-inner-wheel',
            clientX: e.clientX,
            clientY: e.clientY,
            deltaX: e.deltaX,
            deltaY: e.deltaY,
            ctrlKey: !!e.ctrlKey,
            metaKey: !!e.metaKey,
            deltaMode: e.deltaMode || 0
          }, '*');
        }, { passive: false });

        window.addEventListener('pointerdown', function(e) {
          window.parent.postMessage({
            type: 'drawva-widget-inner-pointerdown'
          }, '*');
        }, true);

        // Auto-snapshot after chart likely rendered
        setTimeout(function() { postSnapshot('auto'); }, 900);
        setTimeout(function() { postSnapshot('auto'); }, 2200);
      })();
    <\/script>`;

    const transparentBase = '<style>html,body{background:transparent!important;overflow:hidden!important;margin:0!important;padding:0!important;box-sizing:border-box;width:100%;height:100%;min-width:0;min-height:0;touch-action:none!important;overscroll-behavior:contain!important}body:not(:has(#stage)){padding:0!important}#stage{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box;margin:0}#stage svg,#stage canvas{display:block;margin:auto;max-width:100%;max-height:100%}::-webkit-scrollbar{display:none!important}</style>' + autoResizeScript;
    const source = /<\/head>/i.test(html)
      ? html.replace(/<\/head>/i, transparentBase + '</head>')
      : transparentBase + html;
    inner.srcdoc = source;
  }

  function forward(msg) {
    if (parentOrigin) parent.postMessage(msg, parentOrigin);
  }
  // Fallback for snapshots/wheel if origin not pinned. Never used for content.
  const postAnywhere = (msg) => parent.postMessage(msg, "*");

  addEventListener("message", (event) => {
    const data = event.data;
    if (!data || typeof data !== "object") return;
    const fromParent = event.source === parent;
    const fromInner = event.source === inner.contentWindow;
    if (data.type === "drawva-widget-init") {
      if (!fromParent) return;
      if (typeof data.html !== "string" || data.html.length > MAX_HTML_LENGTH) return;
      writeInner(data.html);
    } else if (data.type === "drawva-widget-state") {
      if (!fromParent) return;
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-state", selected: !!data.selected, active: !!data.active }, "*");
    } else if (data.type === "drawva-widget-layout-size") {
      if (!fromParent || !Number.isFinite(data.width) || !Number.isFinite(data.height) || data.width < 80 || data.width > 3200 || data.height < 60 || data.height > 6000) return;
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-layout-size", width: Math.round(data.width), height: Math.round(data.height) }, "*");
    } else if (data.type === "drawva-widget-inner-wheel") {
      if (!fromInner) return;
      postAnywhere({
        type: "drawva-widget-wheel",
        clientX: data.clientX,
        clientY: data.clientY,
        deltaX: data.deltaX,
        deltaY: data.deltaY,
        ctrlKey: !!data.ctrlKey,
        metaKey: !!data.metaKey,
        deltaMode: data.deltaMode || 0
      });
    } else if (data.type === "drawva-widget-inner-pointerdown") {
      if (!fromInner) return;
      postAnywhere({ type: "drawva-widget-pointerdown" });
    } else if (data.type === "drawva-widget-updated") {
      if (!fromInner) return;
      forward({ type: "drawva-widget-updated" });
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-snapshot-request", reqId: "updated" }, "*");
    } else if (data.type === "drawva-widget-snapshot-request") {
      if (!fromParent) return;
      // Forward snapshot request into the inner iframe
      inner.contentWindow && inner.contentWindow.postMessage({ type: "drawva-widget-snapshot-request", reqId: data.reqId }, "*");
    } else if (data.type === "drawva-widget-inner-snapshot") {
      if (!fromInner) return;
      // Forward snapshot response from inner iframe up to parent
      postAnywhere({ type: "drawva-widget-snapshot", reqId: data.reqId, dataUrl: data.dataUrl, w: data.w, h: data.h });
    }
  });

  // Forward wheel from inside the host so the parent canvas still pans/zooms.
  addEventListener("wheel", (ev) => {
    ev.preventDefault();
    postAnywhere({
      type: "drawva-widget-wheel",
      clientX: ev.clientX,
      clientY: ev.clientY,
      deltaX: ev.deltaX,
      deltaY: ev.deltaY,
      ctrlKey: !!ev.ctrlKey,
      metaKey: !!ev.metaKey,
      deltaMode: ev.deltaMode || 0
    });
  }, { passive: false });

  // Forward pointerdown from inside the host so parent WidgetManager selects this widget on click.
  addEventListener("pointerdown", () => {
    postAnywhere({ type: "drawva-widget-pointerdown" });
  }, true);

  forward({ type: "drawva-widget-host-ready" });
})();
</script>
</body>
</html>
