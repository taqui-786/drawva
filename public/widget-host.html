<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawva Widget Host</title>
  <!-- Tailwind CSS CDN so AI-generated Tailwind classes actually work -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: auto;
      min-height: 100%;
      background: transparent !important;
      overflow: visible !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    /* Hide all scrollbars */
    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    #widget-root {
      width: auto;
      height: auto;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: transparent !important;
    }
    /* Strip outer full-page wrappers if AI included min-h-screen or page background colors */
    #widget-root > div[class*="min-h-screen"],
    #widget-root > div[class*="bg-gray-"],
    #widget-root > div[class*="bg-slate-"],
    #widget-root > div[class*="bg-zinc-"],
    #widget-root > div[class*="bg-neutral-"],
    #widget-root > div[class*="bg-stone-"] {
      background-color: transparent !important;
      min-height: auto !important;
      width: auto !important;
      display: flex !important;
      align-items: flex-start !important;
      justify-content: center !important;
    }
  </style>
</head>
<body>
  <div id="widget-root"></div>

  <script>
    (function () {
      var root = document.getElementById("widget-root");
      var currentWidgetId = null;

      function measureAndNotify() {
        if (!currentWidgetId) return;
        var firstChild = root.firstElementChild;
        if (!firstChild) return;
        var w = Math.ceil(Math.max(firstChild.scrollWidth, firstChild.offsetWidth, 120));
        var h = Math.ceil(Math.max(firstChild.scrollHeight, firstChild.offsetHeight, 80));
        if (w > 60 && h > 40) {
          window.parent.postMessage({
            type: "drawva-widget-resize",
            widgetId: currentWidgetId,
            w: w,
            h: h
          }, "*");
        }
      }

      // Use ResizeObserver for continuous size tracking
      var resizeObserver = null;
      if (typeof ResizeObserver !== "undefined") {
        resizeObserver = new ResizeObserver(function () {
          measureAndNotify();
        });
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.type === "drawva-widget-init") {
          if (typeof data.html === "string") {
            currentWidgetId = data.widgetId || null;
            root.innerHTML = data.html;

            // Execute inline scripts inside injected HTML
            var scripts = root.querySelectorAll("script");
            scripts.forEach(function (oldScript) {
              var newScript = document.createElement("script");
              Array.from(oldScript.attributes).forEach(function (attr) {
                newScript.setAttribute(attr.name, attr.value);
              });
              newScript.appendChild(document.createTextNode(oldScript.innerHTML));
              if (oldScript.parentNode) {
                oldScript.parentNode.replaceChild(newScript, oldScript);
              }
            });

            // Observe the first child for size changes
            if (resizeObserver && root.firstElementChild) {
              resizeObserver.disconnect();
              resizeObserver.observe(root.firstElementChild);
            }

            // Measure after content settles (multiple ticks for CSS/fonts/images)
            setTimeout(measureAndNotify, 100);
            setTimeout(measureAndNotify, 500);
            setTimeout(measureAndNotify, 1500);
          }

          // Notify parent that widget is ready
          window.parent.postMessage({ type: "drawva-widget-ready", widgetId: data.widgetId }, "*");
        }
      });

      // Forward wheel/zoom events to parent canvas
      window.addEventListener(
        "wheel",
        function (e) {
          window.parent.postMessage(
            {
              type: "drawva-widget-wheel",
              widgetId: currentWidgetId,
              deltaY: e.deltaY,
            },
            "*"
          );
        },
        { passive: true }
      );

      // Signal host loaded
      window.parent.postMessage({ type: "drawva-host-ready" }, "*");
    })();
  </script>
</body>
</html>
