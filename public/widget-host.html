<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawva Widget Host</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; color-scheme: light; border: 0; }
    html, body { overflow: hidden; background: transparent; }
    iframe { display: block; touch-action: none; background: transparent; }
  </style>
</head>
<body>
  <script>
    "use strict";
    (() => {
      const inner = document.createElement("iframe");
      inner.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
      inner.style.width = "100%";
      inner.style.height = "100%";
      inner.style.border = "none";
      document.body.append(inner);

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.type === "set-content") {
          const doc = inner.contentDocument || inner.contentWindow.document;
          doc.open();
          doc.write(data.html || "");
          doc.close();
        }
      });

      window.parent.postMessage({ type: "widget-host-ready" }, "*");
    })();
  </script>
</body>
</html>
